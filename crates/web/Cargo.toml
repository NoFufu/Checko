[package]
name = "checko-web"
version.workspace = true
edition.workspace = true

[dependencies]
checko-core = { path = "../core" }
chrono.workspace = true
serde.workspace = true
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
uuid.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "DataTransfer", "Document", "DomRect", "DragEvent", "Element", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "MediaQueryList", "MouseEvent", "Navigator", "Notification", "NotificationOptions", "NotificationPermission", "PushManager", "PushSubscription", "PushSubscriptionOptionsInit", "ServiceWorkerContainer", "ServiceWorkerRegistration", "Storage", "Window"] }
