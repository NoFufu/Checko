[package]
name = "checko-web"
version.workspace = true
edition.workspace = true

[dependencies]
checko-core = { path = "../core" }
chrono.workspace = true
serde.workspace = true
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
uuid.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DataTransfer", "Document", "DomRect", "DragEvent", "Element", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "MouseEvent", "Storage", "Window"] }
