name: Keep sync server awake
# Pings the free Render server so it does not fall asleep.
# Needs the repository variable CHECKO_SERVER_URL (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.CHECKO_SERVER_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.CHECKO_SERVER_URL }}/health" || true
